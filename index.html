<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspolog — 주간 리포트</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>

  :root {
    --bg: #f8f9fc; --surface: #ffffff; --border: #e8ecf0;
    --text: #1a1d23; --text2: #6b7280; --accent: #6366f1;
    --radius: 16px; --shadow: 0 2px 12px rgba(0,0,0,.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
         background: var(--bg); color: var(--text); min-height: 100vh; }
  .header {
    background: linear-gradient(135deg, #1a1d23 0%, #2d3748 100%);
    padding: 0 32px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,.3);
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 32px; height: 32px; background: var(--accent);
               border-radius: 8px; display: flex; align-items: center;
               justify-content: center; font-size: 16px; }
  .logo-text { color: #fff; font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
  .logo-sub  { color: #9ca3af; font-size: 12px; margin-top: 1px; }
  .link-card {
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); overflow: hidden;
    box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s;
    cursor: pointer; text-decoration: none; display: flex; flex-direction: column;
  }
  .link-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,.12); }
  .card-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover;
                background: #f1f5f9; display: block; }
  .card-thumb-placeholder {
    width: 100%; aspect-ratio: 16/9;
    display: flex; align-items: center; justify-content: center; font-size: 36px;
  }
  .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
  .card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .cat-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .card-date { font-size: 11px; color: var(--text2); margin-left: auto; }
  .card-title {
    font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.45; margin-bottom: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-summary {
    font-size: 12px; color: var(--text2); line-height: 1.6; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-domain { margin-top: 12px; font-size: 11px; color: #9ca3af;
                 display: flex; align-items: center; gap: 4px; }
  .card-domain img { width: 14px; height: 14px; border-radius: 3px; }
  .link-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }
  .card { background: var(--surface); border-radius: var(--radius);
          border: 1px solid var(--border); box-shadow: var(--shadow); padding: 24px; }
  .section-title { font-size: 15px; font-weight: 700; color: var(--text);
                   margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ''; width: 3px; height: 16px;
                            background: var(--accent); border-radius: 2px; }

  .btn-all {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff; border: none; padding: 8px 20px; border-radius: 20px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 4px 14px rgba(99,102,241,.4);
  }
  .btn-all:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,.5); }
  .week-badge { background: rgba(99,102,241,.25); color: #a5b4fc;
                padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .hero {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 48px 32px 36px; position: relative; overflow: hidden;
  }
  .hero::before { content:''; position:absolute; right:-60px; top:-60px;
    width:320px; height:320px; border-radius:50%; background:rgba(255,255,255,.06); }
  .hero::after  { content:''; position:absolute; right:80px; bottom:-80px;
    width:200px; height:200px; border-radius:50%; background:rgba(255,255,255,.04); }
  .hero-label { color:rgba(255,255,255,.7); font-size:13px; font-weight:500;
                letter-spacing:.5px; margin-bottom:8px; }
  .hero-title { color:#fff; font-size:28px; font-weight:800;
                letter-spacing:-.5px; margin-bottom:6px; }
  .hero-sub   { color:rgba(255,255,255,.75); font-size:14px; }
  .hero-stats { display:flex; gap:32px; margin-top:28px; }
  .stat-num   { color:#fff; font-size:32px; font-weight:800; line-height:1; }
  .stat-label { color:rgba(255,255,255,.65); font-size:12px; margin-top:4px; }
  .main { max-width:1280px; margin:0 auto; padding:32px 24px; }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:28px; }
  @media(max-width:768px){ .grid-2 { grid-template-columns:1fr; } }
  .chart-wrap { position:relative; height:200px;
                display:flex; align-items:center; justify-content:center; }
  .chart-center { position:absolute; text-align:center; pointer-events:none; }
  .chart-center-num { font-size:28px; font-weight:800; color:var(--text); }
  .chart-center-label { font-size:11px; color:var(--text2); }
  .legend { margin-top:16px; display:flex; flex-wrap:wrap; gap:8px; }
  .legend-item { display:flex; align-items:center; gap:6px;
                  font-size:12px; color:var(--text); white-space:nowrap; }
  .legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .tag-cloud { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .tag-chip { display:inline-flex; align-items:center; gap:4px;
               padding:6px 14px; border-radius:20px; font-weight:600; transition:transform .15s; }
  .tag-chip:hover { transform:scale(1.05); }
  .tag-cnt { font-size:11px; opacity:.7; }
  .links-header { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .links-title { font-size:17px; font-weight:700; }
  .count-badge { background:var(--accent); color:#fff;
                 font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; }
  .generated { font-size:11px; color:var(--text2); margin-left:auto; }
  .link-card { animation: fadeUp .25s ease both; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }
</style>
</head>

  <div class="logo">

    <div>
      <div class="logo-text">Inspolog</div>
      <div class="logo-sub">Link Curation</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">

    <a href="all.html" class="btn-all">전체보기 →</a>

<main class="main">

    </div>
    <div class="card">

      <div class="tag-cloud" id="tagCloud"></div>

  </div>

const TAG_COLORS = [
  ['#6366f1','#eef0ff'],['#8b5cf6','#f5f3ff'],['#06b6d4','#ecfeff'],
  ['#10b981','#ecfdf5'],['#f59e0b','#fffbeb'],['#ec4899','#fdf2f8'],

];


function makeCard(link, delay=0) {
  const m = CM[link.category] || {color:'#6b7280', light:'#f9fafb', emoji:'🔗'};
  const thumb = link.thumbnail
    ? `<img class="card-thumb" src="${link.thumbnail}" alt="" loading="lazy"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
       <div class="card-thumb-placeholder" style="background:${m.light};display:none">${m.emoji}</div>`
    : `<div class="card-thumb-placeholder" style="background:${m.light}">${m.emoji}</div>`;

  const a = document.createElement('a');
  a.className = 'link-card';
  a.href = link.url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.style.animationDelay = delay + 'ms';
  a.innerHTML = `${thumb}
    <div class="card-body">
      <div class="card-meta">
        <span class="cat-badge" style="background:${m.light};color:${m.color}">${m.emoji} ${link.category}</span>
        <span class="card-date">${link.date_fmt}</span>
      </div>
      <div class="card-title">${link.title}</div>
      <div class="card-summary">${link.summary}</div>
      <div class="card-domain">
        <img src="https://www.google.com/s2/favicons?domain=${link.domain}&sz=16" alt="">
        ${link.domain}
      </div>
    </div>`;
  return a;
}


function animateCount(el, n) {
  let v=0; const s=Math.ceil(n/30);
  const t=setInterval(()=>{ v=Math.min(v+s,n); el.textContent=v; if(v>=n)clearInterval(t); },30);
}

window.addEventListener('DOMContentLoaded', () => {
  const tags = new Set();
  WEEK_LINKS.forEach(l => l.topic_tags && l.topic_tags.split(',').forEach(t => tags.add(t.trim())));
  const cats = new Set(WEEK_LINKS.map(l => l.category));
  animateCount(document.getElementById('sLinks'),  WEEK_LINKS.length);
  animateCount(document.getElementById('sCats'),   cats.size);
  animateCount(document.getElementById('sTags'),   tags.size);
  animateCount(document.getElementById('sTotal'),  ALL_LINKS.length);

  document.getElementById('chartNum').textContent = WEEK_LINKS.length;
  new Chart(document.getElementById('catChart').getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: CAT_CHART.map(c => c.cat + ' ' + c.cnt),
      datasets: [{ data: CAT_CHART.map(c=>c.cnt), backgroundColor: CAT_CHART.map(c=>c.color),
                    borderWidth:2, borderColor:'#fff', hoverOffset:8 }]
    },
    options: { cutout:'68%', responsive:true, maintainAspectRatio:true,
                plugins: { legend:{display:false}, tooltip:{ callbacks:{ label: c=>' '+c.label+'개' } } } }
  });

  const legend = document.getElementById('catLegend');
  CAT_CHART.forEach(c => {
    legend.innerHTML += `<div class="legend-item">
      <span class="legend-dot" style="background:${c.color}"></span>
      <span>${c.cat} <b>${c.cnt}</b></span></div>`;
  });

  const cloud = document.getElementById('tagCloud');
  TAGS_TOP.forEach((t,i) => {
    const [fg,bg] = TAG_COLORS[i%TAG_COLORS.length];
    const sz = 11 + Math.round((t.cnt/TAGS_TOP[0].cnt)*6);
    cloud.innerHTML += `<span class="tag-chip" style="background:${bg};color:${fg};font-size:${sz}px">
      ${t.tag} <span class="tag-cnt">${t.cnt}</span></span>`;
  });

  document.getElementById('linkCount').textContent = WEEK_LINKS.length;
  const grid = document.getElementById('linkGrid');
  WEEK_LINKS.forEach((link, i) => grid.appendChild(makeCard(link, i*30)));
});
